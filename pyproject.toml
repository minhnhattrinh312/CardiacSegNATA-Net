[project]
name = "cmrseg-challange"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Minh Nhat Trinh", email = "nhatthdyh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.7",
    "lightning>=2.6.6",
    "natsort>=8.4.0",
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.30.0",
    "onnxscript>=0.7.2",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "simpleitk>=2.5.6",
    "torch==2.12",
    "torchvision>=0.27.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[project.scripts]
cmrseg-challange = "cmrseg_challange:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
